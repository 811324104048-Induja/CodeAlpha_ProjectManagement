<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Taskora</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
    <a href="index.html" class="brand auth-brand">Taskora<span>.</span></a>

    <main class="auth-card">
        <div class="auth-icon">✦</div>
        <h1>Create your account</h1>
        <p class="muted">Start bringing your team's ideas to life.</p>

        <form id="signupForm">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text"
                   placeholder="Your name" maxlength="100" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" placeholder="At least 8 characters" required>

            <button class="btn btn-primary full-width" type="submit">
                Create account
            </button>
            <p id="authMessage" class="form-message"></p>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </main>
</body>
</html>
