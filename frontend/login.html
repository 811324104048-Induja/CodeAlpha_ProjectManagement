<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Taskora</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
    <a href="index.html" class="brand auth-brand">Taskora<span>.</span></a>

    <main class="auth-card">
        <div class="auth-icon">✦</div>
        <h1>Welcome back!</h1>
        <p class="muted">Log in to continue your team's progress.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   placeholder="Enter your password" required>

            <button class="btn btn-primary full-width" type="submit">
                Log in to Taskora
            </button>
            <p id="authMessage" class="form-message"></p>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>
    </main>
</body>
</html>
